<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream of Sheep - Isometric Shepherding Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #87CEEB;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #98D8C8 100%);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 14px;
            pointer-events: none;
        }
        #debug-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
            display: none;
            pointer-events: auto;
        }
        #debug-panel.visible {
            display: block;
        }
        #debug-panel h3 {
            margin-bottom: 10px;
            font-size: 14px;
            color: #ffa500;
        }
        .slider-group {
            margin: 10px 0;
        }
        .slider-group label {
            display: block;
            margin-bottom: 5px;
        }
        .slider-group input[type="range"] {
            width: 100%;
        }
        .slider-group .value {
            display: inline-block;
            margin-left: 10px;
            color: #ffa500;
        }
        button {
            margin: 5px 0;
            padding: 5px 10px;
            background: #ffa500;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #ff8c00;
        }
        #yaml-area {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            background: #1a1a1a;
            color: #0f0;
            border: 1px solid #ffa500;
            padding: 5px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1200" height="800"></canvas>
    <div id="ui">
        <div>Use WASD or Arrow Keys to move shepherd</div>
        <div>Press G to toggle gate</div>
        <div>Press D for debug mode</div>
    </div>
    <div id="debug-panel">
        <h3>Debug Mode</h3>
        <div id="debug-info"></div>
        
        <h3 style="margin-top: 15px;">Behavior Parameters</h3>
        
        <div class="slider-group">
            <label>Flee Distance: <span class="value" id="flee-val">150</span></label>
            <input type="range" id="flee-distance" min="50" max="300" value="150">
        </div>
        
        <div class="slider-group">
            <label>Flee Speed: <span class="value" id="flee-speed-val">2.5</span></label>
            <input type="range" id="flee-speed" min="1" max="5" step="0.1" value="2.5">
        </div>
        
        <div class="slider-group">
            <label>Cohesion: <span class="value" id="cohesion-val">0.5</span></label>
            <input type="range" id="cohesion" min="0" max="2" step="0.1" value="0.5">
        </div>
        
        <div class="slider-group">
            <label>Alignment: <span class="value" id="alignment-val">0.3</span></label>
            <input type="range" id="alignment" min="0" max="2" step="0.1" value="0.3">
        </div>
        
        <div class="slider-group">
            <label>Separation: <span class="value" id="separation-val">1.0</span></label>
            <input type="range" id="separation" min="0" max="3" step="0.1" value="1.0">
        </div>
        
        <div class="slider-group">
            <label>Wander: <span class="value" id="wander-val">0.5</span></label>
            <input type="range" id="wander" min="0" max="2" step="0.1" value="0.5">
        </div>
        
        <button id="export-yaml">Export YAML</button>
        <button id="import-yaml">Import YAML</button>
        <textarea id="yaml-area" placeholder="YAML config will appear here..."></textarea>
    </div>

    <script>
        // Game configuration
        const config = {
            canvas: null,
            ctx: null,
            width: 1200,
            height: 800,
            debugMode: false,
            gateOpen: false,
            
            // Behavior parameters
            params: {
                fleeDistance: 150,
                fleeSpeed: 2.5,
                cohesion: 0.5,
                alignment: 0.3,
                separation: 1.0,
                wander: 0.5
            }
        };

        // Isometric helpers
        const iso = {
            tileWidth: 40,
            tileHeight: 20,
            
            toScreen(x, y, z = 0) {
                const screenX = (x - y) * (this.tileWidth / 2);
                const screenY = (x + y) * (this.tileHeight / 2) - z;
                return { x: screenX, y: screenY };
            },
            
            toWorld(screenX, screenY) {
                const x = (screenX / (this.tileWidth / 2) + screenY / (this.tileHeight / 2)) / 2;
                const y = (screenY / (this.tileHeight / 2) - screenX / (this.tileWidth / 2)) / 2;
                return { x, y };
            }
        };

        // Terrain generation
        class Terrain {
            constructor(width, height) {
                this.width = width;
                this.height = height;
                this.heightMap = [];
                this.generateHeightMap();
            }
            
            generateHeightMap() {
                // Create valley/hill shaped terrain
                for (let y = 0; y < this.height; y++) {
                    this.heightMap[y] = [];
                    for (let x = 0; x < this.width; x++) {
                        // Create valley in center with hills on edges
                        const centerX = this.width / 2;
                        const centerY = this.height / 2;
                        const distFromCenter = Math.sqrt(
                            Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2)
                        );
                        const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);
                        
                        // Valley dips in center, rises at edges
                        let height = (distFromCenter / maxDist) * 30;
                        
                        // Add some noise for natural look
                        height += Math.sin(x * 0.3) * 3 + Math.cos(y * 0.3) * 3;
                        
                        this.heightMap[y][x] = Math.max(0, height);
                    }
                }
            }
            
            getHeight(x, y) {
                const ix = Math.floor(x);
                const iy = Math.floor(y);
                if (ix < 0 || ix >= this.width || iy < 0 || iy >= this.height) {
                    return 0;
                }
                return this.heightMap[iy][ix];
            }
            
            draw(ctx, offsetX, offsetY) {
                // Draw backdrop grid (rising mountains in background)
                ctx.strokeStyle = 'rgba(100, 150, 100, 0.3)';
                ctx.lineWidth = 1;
                
                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        const z = this.getHeight(x, y);
                        const screen = iso.toScreen(x, y, z);
                        const sx = screen.x + offsetX;
                        const sy = screen.y + offsetY;
                        
                        // Draw tile as diamond
                        const hw = iso.tileWidth / 2;
                        const hh = iso.tileHeight / 2;
                        
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(sx + hw, sy + hh);
                        ctx.lineTo(sx, sy + hh * 2);
                        ctx.lineTo(sx - hw, sy + hh);
                        ctx.closePath();
                        
                        // Color based on height
                        const brightness = 100 + (z / 30) * 100;
                        ctx.fillStyle = `rgb(${brightness * 0.5}, ${brightness}, ${brightness * 0.5})`;
                        ctx.fill();
                        ctx.stroke();
                    }
                }
            }
        }

        // Mountain background
        class MountainBackground {
            constructor() {
                this.layers = [
                    { peaks: this.generatePeaks(5, 200, 300), color: 'rgba(80, 80, 120, 0.3)', y: 50 },
                    { peaks: this.generatePeaks(7, 150, 250), color: 'rgba(100, 100, 140, 0.4)', y: 100 },
                    { peaks: this.generatePeaks(10, 100, 200), color: 'rgba(120, 120, 160, 0.5)', y: 150 }
                ];
            }
            
            generatePeaks(count, minHeight, maxHeight) {
                const peaks = [];
                const spacing = config.width / count;
                for (let i = 0; i < count; i++) {
                    peaks.push({
                        x: i * spacing + spacing / 2,
                        height: minHeight + Math.random() * (maxHeight - minHeight),
                        width: spacing * 0.8
                    });
                }
                return peaks;
            }
            
            draw(ctx) {
                this.layers.forEach(layer => {
                    ctx.fillStyle = layer.color;
                    ctx.beginPath();
                    ctx.moveTo(0, config.height);
                    
                    layer.peaks.forEach((peak, i) => {
                        const baseY = layer.y + 200;
                        if (i === 0) {
                            ctx.lineTo(0, baseY);
                        }
                        ctx.lineTo(peak.x - peak.width / 2, baseY);
                        ctx.lineTo(peak.x, baseY - peak.height);
                        ctx.lineTo(peak.x + peak.width / 2, baseY);
                    });
                    
                    ctx.lineTo(config.width, layer.y + 200);
                    ctx.lineTo(config.width, config.height);
                    ctx.closePath();
                    ctx.fill();
                });
            }
        }

        // Shepherd character
        class Shepherd {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.z = 0;
                this.vx = 0;
                this.vy = 0;
                this.speed = 2;
                this.facing = 0; // angle in radians
            }
            
            update(keys, terrain) {
                this.vx = 0;
                this.vy = 0;
                
                if (keys['KeyW'] || keys['ArrowUp']) this.vy -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) this.vy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) this.vx -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) this.vx += 1;
                
                // Normalize diagonal movement
                const len = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (len > 0) {
                    this.vx = (this.vx / len) * this.speed;
                    this.vy = (this.vy / len) * this.speed;
                    this.facing = Math.atan2(this.vy, this.vx);
                }
                
                this.x += this.vx;
                this.y += this.vy;
                
                // Keep in bounds
                this.x = Math.max(0, Math.min(30, this.x));
                this.y = Math.max(0, Math.min(30, this.y));
                
                this.z = terrain.getHeight(this.x, this.y);
            }
            
            draw(ctx, offsetX, offsetY) {
                const screen = iso.toScreen(this.x, this.y, this.z);
                const sx = screen.x + offsetX;
                const sy = screen.y + offsetY;
                
                // Draw shepherd as a simple figure
                ctx.save();
                ctx.translate(sx, sy);
                
                // Body
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-5, -15, 10, 15);
                
                // Head
                ctx.fillStyle = '#FFDAB9';
                ctx.beginPath();
                ctx.arc(0, -20, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Staff (facing direction indicator)
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -10);
                const staffLen = 20;
                const staffX = Math.cos(this.facing) * staffLen;
                const staffY = Math.sin(this.facing) * staffLen;
                ctx.lineTo(staffX, -10 + staffY);
                ctx.stroke();
                
                ctx.restore();
            }
        }

        // Sheep entity
        class Sheep {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.z = 0;
                this.vx = Math.random() * 2 - 1;
                this.vy = Math.random() * 2 - 1;
                this.legPhase = Math.random() * Math.PI * 2;
            }
            
            update(shepherd, allSheep, terrain, params) {
                // Flee from shepherd
                const dx = this.x - shepherd.x;
                const dy = this.y - shepherd.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                let fx = 0, fy = 0;
                
                if (dist < params.fleeDistance && dist > 0) {
                    fx += (dx / dist) * params.fleeSpeed;
                    fy += (dy / dist) * params.fleeSpeed;
                }
                
                // Flocking behaviors
                let cohesionX = 0, cohesionY = 0;
                let alignX = 0, alignY = 0;
                let separationX = 0, separationY = 0;
                let nearbyCount = 0;
                
                allSheep.forEach(other => {
                    if (other === this) return;
                    
                    const odx = other.x - this.x;
                    const ody = other.y - this.y;
                    const odist = Math.sqrt(odx * odx + ody * ody);
                    
                    // Check if other sheep is within flocking range (5 units)
                    if (odist < 5 && odist > 0) {
                        // Cohesion - move toward center of nearby sheep
                        cohesionX += other.x;
                        cohesionY += other.y;
                        
                        // Alignment - match velocity
                        alignX += other.vx;
                        alignY += other.vy;
                        
                        // Separation - avoid crowding
                        separationX -= odx / odist;
                        separationY -= ody / odist;
                        
                        nearbyCount++;
                    }
                });
                
                if (nearbyCount > 0) {
                    cohesionX = (cohesionX / nearbyCount - this.x) * params.cohesion * 0.05;
                    cohesionY = (cohesionY / nearbyCount - this.y) * params.cohesion * 0.05;
                    
                    alignX = alignX / nearbyCount * params.alignment * 0.1;
                    alignY = alignY / nearbyCount * params.alignment * 0.1;
                    
                    separationX *= params.separation * 0.1;
                    separationY *= params.separation * 0.1;
                    
                    fx += cohesionX + alignX + separationX;
                    fy += cohesionY + alignY + separationY;
                }
                
                // Random wandering
                fx += (Math.random() - 0.5) * params.wander * 0.5;
                fy += (Math.random() - 0.5) * params.wander * 0.5;
                
                // Apply forces
                this.vx += fx * 0.1;
                this.vy += fy * 0.1;
                
                // Limit speed
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = 1.5;
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Bounce off boundaries
                if (this.x < 0) { this.x = 0; this.vx = Math.abs(this.vx); }
                if (this.x > 30) { this.x = 30; this.vx = -Math.abs(this.vx); }
                if (this.y < 0) { this.y = 0; this.vy = Math.abs(this.vy); }
                if (this.y > 30) { this.y = 30; this.vy = -Math.abs(this.vy); }
                
                this.z = terrain.getHeight(this.x, this.y);
                
                // Animate legs
                this.legPhase += speed * 0.5;
            }
            
            draw(ctx, offsetX, offsetY) {
                const screen = iso.toScreen(this.x, this.y, this.z);
                const sx = screen.x + offsetX;
                const sy = screen.y + offsetY;
                
                ctx.save();
                ctx.translate(sx, sy);
                
                // Body (fluffy oval)
                ctx.fillStyle = '#F0F0F0';
                ctx.strokeStyle = '#CCCCCC';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(0, -8, 8, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                
                // Head
                ctx.fillStyle = '#E8E8E8';
                ctx.beginPath();
                ctx.arc(-6, -10, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                
                // Stick legs (animated)
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                
                const leg1 = Math.sin(this.legPhase) * 3;
                const leg2 = Math.sin(this.legPhase + Math.PI) * 3;
                
                // Front legs
                ctx.beginPath();
                ctx.moveTo(-4, -2);
                ctx.lineTo(-4 + leg1, 2);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(-2, -2);
                ctx.lineTo(-2 + leg2, 2);
                ctx.stroke();
                
                // Back legs
                ctx.beginPath();
                ctx.moveTo(2, -2);
                ctx.lineTo(2 + leg2, 2);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(4, -2);
                ctx.lineTo(4 + leg1, 2);
                ctx.stroke();
                
                ctx.restore();
            }
        }

        // Tree
        class Tree {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.z = 0;
                this.height = 15 + Math.random() * 10;
            }
            
            draw(ctx, offsetX, offsetY, terrain) {
                this.z = terrain.getHeight(this.x, this.y);
                const screen = iso.toScreen(this.x, this.y, this.z);
                const sx = screen.x + offsetX;
                const sy = screen.y + offsetY;
                
                // Trunk
                ctx.fillStyle = '#654321';
                ctx.fillRect(sx - 2, sy - this.height, 4, this.height);
                
                // Foliage (simple triangle)
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.moveTo(sx, sy - this.height - 15);
                ctx.lineTo(sx - 10, sy - this.height);
                ctx.lineTo(sx + 10, sy - this.height);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(sx, sy - this.height - 10);
                ctx.lineTo(sx - 8, sy - this.height + 3);
                ctx.lineTo(sx + 8, sy - this.height + 3);
                ctx.closePath();
                ctx.fill();
            }
        }

        // Pen and Gate
        class Pen {
            constructor() {
                this.corners = [
                    { x: 25, y: 5 },
                    { x: 29, y: 5 },
                    { x: 29, y: 10 },
                    { x: 25, y: 10 }
                ];
                this.gatePos = { x: 25, y: 7.5 };
                this.foodPiles = [
                    { x: 27, y: 7 },
                    { x: 27, y: 8 }
                ];
            }
            
            draw(ctx, offsetX, offsetY, terrain, gateOpen) {
                // Draw fence
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 3;
                
                this.corners.forEach((corner, i) => {
                    const nextCorner = this.corners[(i + 1) % this.corners.length];
                    
                    // Skip gate section when gate is on that side
                    if (i === 0 && gateOpen) {
                        // Draw partial fences around gate
                        const z1 = terrain.getHeight(corner.x, corner.y);
                        const s1 = iso.toScreen(corner.x, corner.y, z1);
                        
                        const midY = (corner.y + nextCorner.y) / 2 - 1;
                        const zm = terrain.getHeight(corner.x, midY);
                        const sm = iso.toScreen(corner.x, midY, zm);
                        
                        ctx.beginPath();
                        ctx.moveTo(s1.x + offsetX, s1.y + offsetY);
                        ctx.lineTo(sm.x + offsetX, sm.y + offsetY);
                        ctx.stroke();
                        
                        const midY2 = (corner.y + nextCorner.y) / 2 + 1;
                        const zm2 = terrain.getHeight(corner.x, midY2);
                        const sm2 = iso.toScreen(corner.x, midY2, zm2);
                        
                        const z2 = terrain.getHeight(nextCorner.x, nextCorner.y);
                        const s2 = iso.toScreen(nextCorner.x, nextCorner.y, z2);
                        
                        ctx.beginPath();
                        ctx.moveTo(sm2.x + offsetX, sm2.y + offsetY);
                        ctx.lineTo(s2.x + offsetX, s2.y + offsetY);
                        ctx.stroke();
                        
                        return;
                    }
                    
                    const z1 = terrain.getHeight(corner.x, corner.y);
                    const z2 = terrain.getHeight(nextCorner.x, nextCorner.y);
                    const s1 = iso.toScreen(corner.x, corner.y, z1);
                    const s2 = iso.toScreen(nextCorner.x, nextCorner.y, z2);
                    
                    ctx.beginPath();
                    ctx.moveTo(s1.x + offsetX, s1.y + offsetY);
                    ctx.lineTo(s2.x + offsetX, s2.y + offsetY);
                    ctx.stroke();
                });
                
                // Draw gate
                if (!gateOpen) {
                    ctx.strokeStyle = '#FF8C00';
                    ctx.lineWidth = 4;
                    const z1 = terrain.getHeight(this.gatePos.x, this.gatePos.y - 1);
                    const z2 = terrain.getHeight(this.gatePos.x, this.gatePos.y + 1);
                    const s1 = iso.toScreen(this.gatePos.x, this.gatePos.y - 1, z1);
                    const s2 = iso.toScreen(this.gatePos.x, this.gatePos.y + 1, z2);
                    
                    ctx.beginPath();
                    ctx.moveTo(s1.x + offsetX, s1.y + offsetY);
                    ctx.lineTo(s2.x + offsetX, s2.y + offsetY);
                    ctx.stroke();
                }
                
                // Draw food piles
                this.foodPiles.forEach(pile => {
                    const z = terrain.getHeight(pile.x, pile.y);
                    const screen = iso.toScreen(pile.x, pile.y, z);
                    const sx = screen.x + offsetX;
                    const sy = screen.y + offsetY;
                    
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(sx, sy, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FFA500';
                    ctx.beginPath();
                    ctx.arc(sx - 2, sy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(sx + 2, sy - 1, 2, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // Game state
        const game = {
            terrain: null,
            mountains: null,
            shepherd: null,
            sheep: [],
            trees: [],
            pen: null,
            keys: {},
            offsetX: 0,
            offsetY: 0,
            lastFrameTime: Date.now(),
            fps: 60,
            
            init() {
                config.canvas = document.getElementById('gameCanvas');
                config.ctx = config.canvas.getContext('2d');
                
                this.terrain = new Terrain(30, 30);
                this.mountains = new MountainBackground();
                this.shepherd = new Shepherd(15, 15);
                this.pen = new Pen();
                
                // Create sheep
                for (let i = 0; i < 15; i++) {
                    this.sheep.push(new Sheep(
                        10 + Math.random() * 10,
                        10 + Math.random() * 10
                    ));
                }
                
                // Create trees
                const treePositions = [
                    {x: 5, y: 5}, {x: 8, y: 6}, {x: 6, y: 25},
                    {x: 20, y: 3}, {x: 22, y: 25}, {x: 10, y: 28},
                    {x: 3, y: 15}, {x: 24, y: 15}
                ];
                treePositions.forEach(pos => {
                    this.trees.push(new Tree(pos.x, pos.y));
                });
                
                // Center view
                this.offsetX = config.width / 2;
                this.offsetY = config.height / 2 - 100;
                
                this.setupEventListeners();
                this.gameLoop();
            },
            
            setupEventListeners() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    
                    if (e.code === 'KeyD') {
                        config.debugMode = !config.debugMode;
                        document.getElementById('debug-panel').classList.toggle('visible');
                    }
                    
                    if (e.code === 'KeyG') {
                        config.gateOpen = !config.gateOpen;
                    }
                });
                
                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                
                // Setup debug sliders
                this.setupDebugControls();
            },
            
            setupDebugControls() {
                const sliders = [
                    { id: 'flee-distance', param: 'fleeDistance', display: 'flee-val' },
                    { id: 'flee-speed', param: 'fleeSpeed', display: 'flee-speed-val' },
                    { id: 'cohesion', param: 'cohesion', display: 'cohesion-val' },
                    { id: 'alignment', param: 'alignment', display: 'alignment-val' },
                    { id: 'separation', param: 'separation', display: 'separation-val' },
                    { id: 'wander', param: 'wander', display: 'wander-val' }
                ];
                
                sliders.forEach(slider => {
                    const element = document.getElementById(slider.id);
                    const display = document.getElementById(slider.display);
                    
                    element.addEventListener('input', (e) => {
                        const value = parseFloat(e.target.value);
                        config.params[slider.param] = value;
                        display.textContent = value.toFixed(1);
                    });
                });
                
                document.getElementById('export-yaml').addEventListener('click', () => {
                    const yaml = this.exportYAML();
                    document.getElementById('yaml-area').value = yaml;
                });
                
                document.getElementById('import-yaml').addEventListener('click', () => {
                    const yaml = document.getElementById('yaml-area').value;
                    this.importYAML(yaml);
                });
            },
            
            exportYAML() {
                let yaml = '# Sheep Behavior Configuration\n';
                yaml += 'behaviors:\n';
                yaml += `  fleeDistance: ${config.params.fleeDistance}\n`;
                yaml += `  fleeSpeed: ${config.params.fleeSpeed}\n`;
                yaml += `  cohesion: ${config.params.cohesion}\n`;
                yaml += `  alignment: ${config.params.alignment}\n`;
                yaml += `  separation: ${config.params.separation}\n`;
                yaml += `  wander: ${config.params.wander}\n`;
                return yaml;
            },
            
            importYAML(yaml) {
                try {
                    const lines = yaml.split('\n');
                    lines.forEach(line => {
                        const match = line.match(/(\w+):\s*([\d.]+)/);
                        if (match) {
                            const param = match[1];
                            const value = parseFloat(match[2]);
                            
                            if (config.params.hasOwnProperty(param)) {
                                config.params[param] = value;
                                
                                // Update slider and display
                                const slider = document.getElementById(param.replace(/([A-Z])/g, '-$1').toLowerCase());
                                if (slider) {
                                    slider.value = value;
                                    const display = document.getElementById(slider.id + '-val');
                                    if (display) {
                                        display.textContent = value.toFixed(1);
                                    }
                                }
                            }
                        }
                    });
                } catch (e) {
                    console.error('Error importing YAML:', e);
                }
            },
            
            update() {
                // Calculate FPS
                const now = Date.now();
                const delta = now - this.lastFrameTime;
                this.fps = Math.round(1000 / delta);
                this.lastFrameTime = now;
                
                this.shepherd.update(this.keys, this.terrain);
                this.sheep.forEach(sheep => {
                    sheep.update(this.shepherd, this.sheep, this.terrain, config.params);
                });
            },
            
            draw() {
                const ctx = config.ctx;
                ctx.clearRect(0, 0, config.width, config.height);
                
                // Draw layered mountains
                this.mountains.draw(ctx);
                
                // Draw terrain
                this.terrain.draw(ctx, this.offsetX, this.offsetY);
                
                // Collect all drawable entities and sort by depth
                const entities = [];
                
                this.trees.forEach(tree => {
                    entities.push({ type: 'tree', obj: tree, depth: tree.y });
                });
                
                entities.push({ type: 'pen', obj: this.pen, depth: 5 });
                
                this.sheep.forEach(sheep => {
                    entities.push({ type: 'sheep', obj: sheep, depth: sheep.y });
                });
                
                entities.push({ type: 'shepherd', obj: this.shepherd, depth: this.shepherd.y });
                
                // Sort by depth (painter's algorithm)
                entities.sort((a, b) => a.depth - b.depth);
                
                // Draw all entities
                entities.forEach(entity => {
                    if (entity.type === 'tree') {
                        entity.obj.draw(ctx, this.offsetX, this.offsetY, this.terrain);
                    } else if (entity.type === 'pen') {
                        entity.obj.draw(ctx, this.offsetX, this.offsetY, this.terrain, config.gateOpen);
                    } else if (entity.type === 'sheep') {
                        entity.obj.draw(ctx, this.offsetX, this.offsetY);
                    } else if (entity.type === 'shepherd') {
                        entity.obj.draw(ctx, this.offsetX, this.offsetY);
                    }
                });
                
                // Draw debug info
                if (config.debugMode) {
                    this.drawDebugInfo(ctx);
                }
            },
            
            drawDebugInfo(ctx) {
                // Grid overlay
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.3)';
                ctx.lineWidth = 1;
                
                for (let x = 0; x <= 30; x += 5) {
                    for (let y = 0; y <= 30; y += 5) {
                        const z = this.terrain.getHeight(x, y);
                        const screen = iso.toScreen(x, y, z);
                        const sx = screen.x + this.offsetX;
                        const sy = screen.y + this.offsetY;
                        
                        ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                        ctx.fillRect(sx - 2, sy - 2, 4, 4);
                        
                        ctx.fillStyle = 'white';
                        ctx.font = '10px monospace';
                        ctx.fillText(`${x},${y}`, sx + 5, sy);
                    }
                }
                
                // Update debug panel info
                const debugInfo = document.getElementById('debug-info');
                debugInfo.innerHTML = `
                    Sheep: ${this.sheep.length}<br>
                    Shepherd: (${this.shepherd.x.toFixed(1)}, ${this.shepherd.y.toFixed(1)})<br>
                    Gate: ${config.gateOpen ? 'OPEN' : 'CLOSED'}<br>
                    FPS: ${this.fps}
                `;
            },
            
            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        };

        // Start the game
        window.addEventListener('load', () => {
            game.init();
        });
    </script>
</body>
</html>
